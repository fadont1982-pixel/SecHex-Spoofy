name: Build SecHex-Spoofy

on:
  workflow_dispatch:  # позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore SecHex-GUI/SecHex-GUI/SecHex-GUI.csproj

    - name: Build
      run: dotnet build SecHex-GUI/SecHex-GUI/SecHex-GUI.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SecHex-GUI/SecHex-GUI/SecHex-GUI.csproj --configuration Release --no-build --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecHex-Spoofy
        path: ./publish/
